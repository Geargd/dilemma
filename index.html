<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethical Dilemma: Infrastructure & Privacy</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; 
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: #111827;
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: relative;
        }

        @media (min-width: 480px) {
            .mobile-container {
                min-height: 85vh;
                border-radius: 24px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
                border: 1px solid #1f2937;
            }
        }

        .header-status {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .quest-stage {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .backstory {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 20px;
            background: #1f2937;
            padding: 18px;
            border-radius: 12px;
            border-left: 4px solid #f43f5e;
        }

        /* Framework banner placed AFTER the choice feedback */
        .legal-framework {
            font-size: 0.85rem;
            background: rgba(244, 63, 94, 0.1);
            color: #fb7185;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            border: 1px solid rgba(244, 63, 94, 0.2);
            line-height: 1.4;
        }

        .question {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .options-container {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 10px;
        }

        .option-btn {
            background-color: #1f2937;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 18px 20px;
            font-size: 1rem;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            font-weight: 500;
            line-height: 1.4;
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
        }

        .option-btn:active {
            background-color: #374151;
            border-color: #f43f5e;
            transform: scale(0.98);
        }

        .restart-btn {
            width: 100%;
            margin-top: auto;
            background: #4c1d95;
            color: #ddd6fe;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(76, 29, 149, 0.3);
        }

        .restart-btn:active {
            background: #5b21b6;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div id="quest-root" style="display: contents;"></div>
    </div>

    <script>
        const storyTree = {
            // LEVEL 1: THE INITIAL DILEMMA
            start: {
                status: "Stage 1 • The Discovery",
                framework: null,
                backstory: "You are a Senior Software Architect developing a next-generation autopilot ecosystem. To achieve rapid path-prediction around urban areas, the system continuously captures, profiles, and cross-references biometric facial data and real-time location metrics of unsuspecting street pedestrians, storing it on centralized corporate servers without public consent.",
                question: "The legal department pushes for an immediate rollout to beat competitors, dismissing privacy concerns as technicalities. Do you sign off on the architecture?",
                options: [
                    { text: "🛑 Block the rollout and demand a complete privacy-first redesign.", nextStep: "path_block" },
                    { text: "🚀 Approve the launch and plan to introduce data scrubbing algorithms later.", nextStep: "path_approve_lvl2" }
                ]
            },

            // LEVEL 2: PATH A (Safety/Privacy Overrides -> Ends in specific outcomes)
            path_block: {
                status: "Stage 2 • Corporate Retaliation",
                framework: "⚖️ Framework Impacted: ACM Code of Ethics (Section 1.2: Avoid Harm & Section 1.6: Respect Privacy). Your decision actively prevented an immediate mass surveillance violation.",
                backstory: "By withholding your signature, you stood up for fundamental data rights. However, corporate executives accuse you of insubordination and threatening market survival. They demand you hand over the repository access controls to a junior manager who is willing to approve the system.",
                question: "If you refuse, you will be terminated immediately and lose your stock options. What do you do?",
                options: [
                    { text: "💼 Refuse to hand over access and document the ethical violation for legal protection.", nextStep: "final_ethical_victory" },
                    { text: "🤝 Yield under corporate pressure, surrender access, and resign quietly.", nextStep: "final_coerced_exit" }
                ]
            },

            // LEVEL 2: PATH B (Approving -> Leads deeper to Level 3)
            path_approve_lvl2: {
                status: "Stage 2 • The Data Breach",
                framework: "🚨 Regulatory Violation: GDPR Article 5 (Principles relating to processing of personal data) & Article 25 (Data protection by design and by default).",
                backstory: "The smart vehicle fleet is deployed. Five months later, a sophisticated cyberattack breaches your centralized servers, leaking unencrypted tracking logs and biometric data of over two million citizens. European data protection authorities launch a major investigation, putting your engineering choices under a microscope.",
                question: "Company lawyers advise you to claim that the telemetry collection was an unpredictable edge-case system anomaly rather than intentional design. Do you support their narrative?",
                options: [
                    { text: "💾 Refuse to mislead regulators and provide the complete architectural blueprints.", nextStep: "path_transparency_lvl3" },
                    { text: "✍️ Accept the company line to avoid personal liability and protect the corporate brand.", nextStep: "final_corporate_shield" }
                ]
            },

            // LEVEL 3: DEEP NESTING (Path B continued)
            path_transparency_lvl3: {
                status: "Stage 3 • Systemic Accountability",
                framework: "⚖️ Framework Invoked: GDPR Article 33 (Notification of a personal data breach) & ACM Code Section 1.4 (Be Fair and Take Action Not to Discriminate).",
                backstory: "Your transparency exposes intentional corporate non-compliance, triggering massive GDPR fines. In retaliation, executive leadership constructs a narrative to the tech press, framing you as a rogue engineer who implemented the invasive tracking mechanism without board authorization.",
                question: "Faced with severe reputational damage, your attorney suggests leaking internal emails that prove the executive board explicitly ordered the tracking feature. Do you leak them?",
                options: [
                    { text: "🗣️ Leak the emails to completely expose the systemic corporate culture.", nextStep: "final_whistleblower_exposure" },
                    { text: "🤫 Maintain silence, relying entirely on standard employment tribunals to clear your name.", nextStep: "final_scapegoat_defeat" }
                ]
            },

            // FINAL OUTCOMES
            final_ethical_victory: {
                status: "Outcome • Professional Integrity",
                framework: "🛡️ Upheld: ACM Code of Ethics Section 1.2 & General Professional Duty to Public Safety.",
                backstory: "You lost your job, but you preserved your integrity. Your documentation protects you during subsequent investigations, and your standing within the international tech-governance community grows significantly. You are hired as a Chief Privacy Officer at an ethical AI consortium.",
                isFinal: true
            },
            final_coerced_exit: {
                status: "Outcome • Compromised Neutrality",
                framework: "❌ Failed Duty: ACM Code Section 2.5 (High standards of professional competence).",
                backstory: "The system was launched by your successor and eventually leaked anyway. While you avoided the initial corporate firing squad, the regulatory inquiry uncovers your initial engineering blueprints. You face severe professional scrutiny for failing to secure the data cycle.",
                isFinal: true
            },
            final_corporate_shield: {
                status: "Outcome • Complete Complicity",
                framework: "🚨 Severe Violations: GDPR Accountability Principle & ACM Code Section 1.3 (Be Honest and Trustworthy).",
                backstory: "You helped protect the corporate infrastructure from immediate collapse, but the internal culture is toxic. You spend your career maintaining deceptive data architectures, permanently abandoning your commitment to user rights and ethical computing rules.",
                isFinal: true
            },
            final_whistleblower_exposure: {
                status: "Outcome • Full Disclosure",
                framework: "⚖️ Enforced: GDPR Transparency mandates and statutory tech whistleblower protections.",
                backstory: "The leaked emails shift the entire financial and criminal liability onto the executive team. The company faces maximum GDPR penalties ($20M+ or 4% of global turnover). You successfully defended systemic truth, though your access to mainstream corporate roles is restricted.",
                isFinal: true
            },
            final_scapegoat_defeat: {
                status: "Outcome • The Scapegoat",
                framework: "❌ Violated: ACM Code Section 2.3 (Know and respect existing rules).",
                backstory: "Without concrete internal corporate proof on the public record, the corporate PR machinery successfully tarnishes your professional reputation. You are held responsible for the architectural failure, while the actual structural incentives remain unchanged.",
                isFinal: true
            }
        };

        function renderStep(stepId) {
            const stepData = storyTree[stepId];
            const root = document.getElementById('quest-root');
            
            if (!stepData) return;

            let html = `
                <div class="quest-stage">
                    <div class="header-status">${stepData.status}</div>
                    
                    /* Renders dynamically after a choice takes place */
                    ${stepData.framework ? `<div class="legal-framework">${stepData.framework}</div>` : ''}
                    
                    <div class="backstory">${stepData.backstory}</div>
                    
                    ${!stepData.isFinal ? `<div class="question">${stepData.question}</div>` : ''}
                    
                    <div class="options-container">
            `;

            if (stepData.options && stepData.options.length > 0) {
                stepData.options.forEach(opt => {
                    html += `
                        <button class="option-btn" onclick="renderStep('${opt.nextStep}')">
                            ${opt.text}
                        </button>
                    `;
                });
            } else if (stepData.isFinal) {
                html += `
                    <button class="restart-btn" onclick="renderStep('start')">
                        🔄 Restart Simulation
                    </button>
                `;
            }

            html += `
                    </div>
                </div>
            `;

            root.innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = function() {
            renderStep('start');
        };
    </script>
</body>
</html>
