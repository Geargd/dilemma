<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethical Dilemma: Algorithmic Integrity</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; 
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: #111827;
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: relative;
        }

        @media (min-width: 480px) {
            .mobile-container {
                min-height: 85vh;
                border-radius: 24px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
                border: 1px solid #1f2937;
            }
        }

        .header-status {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .quest-stage {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .backstory {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 20px;
            background: #1f2937;
            padding: 18px;
            border-radius: 12px;
            border-left: 4px solid #6366f1;
        }

        .legal-framework {
            font-size: 0.85rem;
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-weight: 500;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .question {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .options-container {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 10px;
        }

        .option-btn {
            background-color: #1f2937;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 18px 20px;
            font-size: 1rem;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            font-weight: 500;
            line-height: 1.4;
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
        }

        .option-btn:active {
            background-color: #374151;
            border-color: #818cf8;
            transform: scale(0.98);
        }

        .restart-btn {
            width: 100%;
            margin-top: auto;
            background: #312e81;
            color: #e0e7ff;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(49, 46, 129, 0.3);
        }

        .restart-btn:active {
            background: #3c38ca;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div id="quest-root" style="display: contents;"></div>
    </div>

    <script>
        const storyTree = {
            // LEVEL 1: THE INITIAL DILEMMA
            start: {
                status: "Stage 1 • The Discovery",
                framework: "Applicable Code: ACM Code of Ethics (Section 1.2: Avoid Harm)",
                backstory: "You are a Lead Data Scientist deploying an AI-driven predictive risk assessment system for a major healthcare provider. Forty-eight hours before launch, you discover the algorithm consistently misclassifies minority demographic groups as 'low priority' for preventative critical care due to historical training data bias.",
                question: "Your project manager insists on launching anyway to meet the hard deadline, promising a patch later. What do you do?",
                options: [
                    { text: "🛑 Refuse to deploy and formally escalate the bias issue.", nextStep: "path_escalate" },
                    { text: "🚀 Proceed with the launch but secretly log the algorithmic anomalies.", nextStep: "path_launch_lvl2" }
                ]
            },

            // LEVEL 2: PATH A (Safety first -> branch leads to outcomes)
            path_escalate: {
                status: "Stage 2 • The Corporate Backlash",
                framework: "Applicable Framework: EU AI Act (High-Risk AI Systems Compliance)",
                backstory: "You blocked the deployment. Management is furious about the missed launch window and accuses you of breaching your employment contract. However, your action aligns perfectly with the EU AI Act, which mandates strict data governance and bias mitigation before deployment.",
                question: "The executive team demands you sign off on a liability waiver or face termination. How do you respond?",
                options: [
                    { text: "💼 Stand your ground, document the bias, and prepare for legal protection.", nextStep: "final_whistleblower" },
                    { text: "✍️ Sign the waiver to protect your career, leaving responsibility to the company.", nextStep: "final_compromised" }
                ]
            },

            // LEVEL 2: PATH B (Risk -> continues deeper to Level 3)
            path_launch_lvl2: {
                status: "Stage 2 • The Fallout",
                framework: "Applicable Framework: GDPR (Article 5: Fairness and Transparency)",
                backstory: "The system is live. Three months later, a public health watchdog publishes a report exposing systemic bias in your software, citing real cases where vulnerable patients were denied early intervention. An internal audit begins, and the company is looking for a scapegoat.",
                question: "Your recorded logs prove you knew about the issue before launch. What is your next move?",
                options: [
                    { text: "💾 Leak the internal logs to the press to prove management knew.", nextStep: "path_leak_lvl3" },
                    { text: "🤫 Cooperate with the internal legal team and delete your private logs.", nextStep: "final_corporate_coverup" }
                ]
            },

            // LEVEL 3: DEEP NESTING (Path B continued)
            path_leak_lvl3: {
                status: "Stage 3 • Whistleblowing",
                framework: "Applicable Law: Directive (EU) 2019/1937 (Whistleblower Protection)",
                backstory: "You leaked the data. The media storm is massive. Regulatory bodies are launching multi-million dollar fine proceedings under GDPR and the AI Act. Your identity is secure for now, but an aggressive corporate cybersecurity forensic team is tracking the source of the leak.",
                question: "A junior colleague is falsely accused of being the leaker and faces immediate termination and legal action. Do you come forward?",
                options: [
                    { text: "🗣️ Confess immediately to protect your colleague.", nextStep: "final_martyr" },
                    { text: "🤫 Remain silent to preserve your own safety and let the legal process play out.", nextStep: "final_silent_escape" }
                ]
            },

            // FINAL OUTCOMES
            final_whistleblower: {
                status: "Outcome • Ethical Victory",
                backstory: "You lost your job, but you preserved your professional integrity. Under the ACM Code of Ethics and whistleblower protections, you successfully exposed a system that could have cost lives. You are later hired by an AI ethics research institute.",
                question: "Result: High Professional Integrity.",
                isFinal: true
            },
            final_compromised: {
                status: "Outcome • Complicit",
                backstory: "You saved your job in the short term, but the waiver did not fully shield you. When regulators investigated the biased algorithm, your professional signature was on the approval form. You face severe professional censure and loss of credentials.",
                question: "Result: Professional Liability.",
                isFinal: true
            },
            final_corporate_coverup: {
                status: "Outcome • Systemic Failure",
                backstory: "By deleting the logs, you participated in a corporate cover-up. The company settled out of court, but your self-respect and passion for ethical technology are gone. You remain in a system that prioritizes profits over human compliance.",
                question: "Result: Complete Ethical Compromise.",
                isFinal: true
            },
            final_martyr: {
                status: "Outcome • The Martyr",
                backstory: "You saved your colleague's career but completely sacrificed your own in the corporate world. While highly praised by tech-ethics communities globally, you face ongoing legal battles regarding proprietary data theft.",
                question: "Result: High Personal Cost.",
                isFinal: true
            },
            final_silent_escape: {
                status: "Outcome • The Bystander",
                backstory: "The company shifted the blame, your colleague's career was ruined, and you kept your position. The algorithm was quietly patched, but you must live with the psychological weight of your silence.",
                question: "Result: Survival at an Innocent's Expense.",
                isFinal: true
            }
        };

        function renderStep(stepId) {
            const stepData = storyTree[stepId];
            const root = document.getElementById('quest-root');
            
            if (!stepData) return;

            let html = `
                <div class="quest-stage">
                    <div class="header-status">${stepData.status}</div>
                    ${stepData.framework ? `<div class="legal-framework">${stepData.framework}</div>` : ''}
                    <div class="backstory">${stepData.backstory}</div>
                    <div class="question">${stepData.question}</div>
                    <div class="options-container">
            `;

            if (stepData.options && stepData.options.length > 0) {
                stepData.options.forEach(opt => {
                    html += `
                        <button class="option-btn" onclick="renderStep('${opt.nextStep}')">
                            ${opt.text}
                        </button>
                    `;
                });
            } else if (stepData.isFinal) {
                html += `
                    <button class="restart-btn" onclick="renderStep('start')">
                        🔄 Restart Simulation
                    </button>
                `;
            }

            html += `
                    </div>
                </div>
            `;

            root.innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = function() {
            renderStep('start');
        };
    </script>
</body>
</html>
